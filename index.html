<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Cohort Builder</title>
    <!-- Load SystemJS before everything else -->
    <script src="/node_modules/systemjs/dist/system.js"></script>
    <script src="/node_modules/systemjs/dist/extras/named-register.js"></script>
    <!-- Load Vue globally so SystemJS plugins can use it -->
    <script src="/node_modules/vue/dist/vue.global.js"></script>
    <script>
      // Register Vue with SystemJS using import map and module registration
      (function() {
        'use strict';

        // Ensure SystemJS and Vue are loaded
        if (!window.System) {
          console.error('[SystemJS] window.System is not available!');
          return;
        }

        if (!window.Vue) {
          console.error('[SystemJS] window.Vue is not available!');
          return;
        }

        console.log('[SystemJS] Registering Vue module...', Object.keys(window.Vue).slice(0, 10));

        // Create a module wrapper for Vue - SystemJS expects a plain object
        var vueModule = window.Vue;

        // Use System.register to define the 'vue' module
        // This creates a proper module that can be imported
        window.System.register('vue', [], function(_export, _context) {
          'use strict';
          return {
            setters: [],
            execute: function() {
              // Export the entire Vue object as default
              _export('default', vueModule);

              // Export commonly used named exports
              _export('h', vueModule.h);
              _export('createApp', vueModule.createApp);
              _export('ref', vueModule.ref);
              _export('reactive', vueModule.reactive);
              _export('computed', vueModule.computed);
              _export('watch', vueModule.watch);
              _export('onMounted', vueModule.onMounted);
              _export('onUnmounted', vueModule.onUnmounted);
              _export('provide', vueModule.provide);
              _export('inject', vueModule.inject);
              _export('nextTick', vueModule.nextTick);
              _export('defineComponent', vueModule.defineComponent);
              _export('toRefs', vueModule.toRefs);
              _export('toRef', vueModule.toRef);

              console.log('[SystemJS] Vue module exports registered');
            }
          };
        });

        console.log('[SystemJS] Vue module registered successfully');

        // Verify the module is accessible
        window.System.import('vue').then(function(module) {
          console.log('[SystemJS] Vue module import test successful - has h:', !!module.h, 'has createApp:', !!module.createApp);
        }).catch(function(err) {
          console.error('[SystemJS] Vue module import test failed:', err);
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
