<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Cohort Builder</title>
    <!-- Load SystemJS before everything else -->
    <script src="/Atlas/vendor/system.js"></script>
    <script src="/Atlas/vendor/named-register.js"></script>
    <!-- Load Vue globally so SystemJS plugins can use it -->
    <script src="/Atlas/vendor/vue.global.js"></script>
    <!-- Load Vue Router globally -->
    <script src="/Atlas/vendor/vue-router.global.js"></script>
    <!-- Load React globally for React-based plugins -->
    <script src="/Atlas/vendor/react.production.min.js" onerror="this.onerror=null;this.src='/Atlas/vendor/react.development.js'"></script>
    <script src="/Atlas/vendor/react-dom.production.min.js" onerror="this.onerror=null;this.src='/Atlas/vendor/react-dom.development.js'"></script>
    <script>
      // Register dependencies with SystemJS
      (function() {
        'use strict';

        // Ensure SystemJS and Vue are loaded
        if (!window.System) {
          console.error('[SystemJS] window.System is not available!');
          return;
        }

        if (!window.Vue) {
          console.error('[SystemJS] window.Vue is not available!');
          return;
        }

        console.log('[SystemJS] Registering modules...');

        // Register Vue module
        window.System.register('vue', [], function(_export, _context) {
          'use strict';
          return {
            setters: [],
            execute: function() {
              // Export the entire Vue object as default
              _export('default', window.Vue);

              // Export all Vue APIs (comprehensive list)
              var vueExports = [
                'h', 'createApp', 'ref', 'reactive', 'computed', 'watch',
                'onMounted', 'onUnmounted', 'provide', 'inject', 'nextTick',
                'defineComponent', 'toRefs', 'toRef', 'createElementBlock',
                'openBlock', 'createCommentVNode', 'createElementVNode',
                'createBlock', 'createVNode', 'withCtx', 'renderList',
                'Fragment', 'Teleport', 'Suspense', 'KeepAlive', 'Transition',
                'TransitionGroup', 'withDirectives', 'resolveComponent',
                'resolveDirective', 'resolveDynamicComponent', 'mergeProps',
                'toHandlers', 'renderSlot', 'createSlots', 'withModifiers',
                'withKeys', 'vShow', 'vModelText', 'vModelCheckbox',
                'vModelRadio', 'vModelSelect', 'vModelDynamic', 'shallowRef',
                'shallowReactive', 'readonly', 'shallowReadonly', 'isRef',
                'isReactive', 'isReadonly', 'isProxy', 'toRaw', 'markRaw',
                'unref', 'proxyRefs', 'customRef', 'triggerRef', 'watchEffect',
                'watchPostEffect', 'watchSyncEffect', 'onBeforeMount',
                'onBeforeUpdate', 'onUpdated', 'onBeforeUnmount', 'onActivated',
                'onDeactivated', 'onErrorCaptured', 'onRenderTracked',
                'onRenderTriggered', 'onServerPrefetch', 'getCurrentInstance',
                'useSlots', 'useAttrs', 'useCssModule', 'useCssVars'
              ];

              vueExports.forEach(function(key) {
                if (window.Vue[key]) {
                  _export(key, window.Vue[key]);
                }
              });

              console.log('[SystemJS] Vue module registered with', vueExports.length, 'exports');
            }
          };
        });

        // Register Vue Router module
        window.System.register('vue-router', [], function(_export, _context) {
          'use strict';
          return {
            setters: [],
            execute: function() {
              _export('default', window.VueRouter);
              _export('createRouter', window.VueRouter.createRouter);
              _export('createWebHistory', window.VueRouter.createWebHistory);
              _export('useRouter', window.VueRouter.useRouter);
              _export('useRoute', window.VueRouter.useRoute);

              console.log('[SystemJS] Vue Router module registered');
            }
          };
        });

        // Load and register single-spa-vue
        window.System.import('/Atlas/vendor/single-spa-vue.js').then(function(module) {
          console.log('[SystemJS] single-spa-vue loaded:', module);
          // Register it under the 'single-spa-vue' name
          window.System.register('single-spa-vue', [], function(_export) {
            return {
              setters: [],
              execute: function() {
                _export('default', module.default);
                console.log('[SystemJS] single-spa-vue module registered');
              }
            };
          });
        }).catch(function(err) {
          console.error('[SystemJS] Failed to load single-spa-vue:', err);
        });

        // Register React module
        if (window.React) {
          var reactModule = { default: window.React };
          var reactExports = [
            'Children', 'Component', 'Fragment', 'Profiler', 'PureComponent',
            'StrictMode', 'Suspense', 'cloneElement', 'createContext',
            'createElement', 'createFactory', 'createRef', 'forwardRef',
            'isValidElement', 'lazy', 'memo', 'startTransition', 'useCallback',
            'useContext', 'useDebugValue', 'useDeferredValue', 'useEffect',
            'useId', 'useImperativeHandle', 'useInsertionEffect', 'useLayoutEffect',
            'useMemo', 'useReducer', 'useRef', 'useState', 'useSyncExternalStore',
            'useTransition', 'version'
          ];
          reactExports.forEach(function(key) {
            if (window.React[key] !== undefined) {
              reactModule[key] = window.React[key];
            }
          });
          window.System.set('react', reactModule);
        }

        // Register ReactDOM module
        if (window.ReactDOM) {
          var reactDOMModule = { default: window.ReactDOM };
          var reactDOMExports = [
            'createPortal', 'createRoot', 'findDOMNode', 'flushSync',
            'hydrate', 'hydrateRoot', 'render', 'unmountComponentAtNode',
            'unstable_batchedUpdates', 'version'
          ];
          reactDOMExports.forEach(function(key) {
            if (window.ReactDOM[key] !== undefined) {
              reactDOMModule[key] = window.ReactDOM[key];
            }
          });
          window.System.set('react-dom', reactDOMModule);

          // Register react-dom/client for React 18+
          var reactDOMClientModule = {
            default: window.ReactDOM,
            createRoot: window.ReactDOM.createRoot,
            hydrateRoot: window.ReactDOM.hydrateRoot
          };
          window.System.set('react-dom/client', reactDOMClientModule);
        }

        // Load single-spa-react
        window.System.import('/Atlas/vendor/single-spa-react.js').then(function(module) {
          window.System.set('single-spa-react', { default: module.default || module });
        }).catch(function(err) {
          console.error('[SystemJS] Failed to load single-spa-react:', err);
        });

        console.log('[SystemJS] Module registration started');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
