name: Publish @ohdsi/atlas-ui

on:
  push:
    branches: [develop]
    tags: ['atlas-ui-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ohdsi'
          cache: 'npm'
      - run: npm ci
      - run: npm run lib:build
      - name: Stamp prerelease version on develop
        if: github.ref == 'refs/heads/develop'
        run: |
          cd packages/atlas-ui
          TS=$(date +%Y%m%d%H%M%S); SHA=$(git rev-parse --short HEAD)
          npm version --no-git-tag-version "$(node -p "require('./package.json').version")-$TS-$SHA"
      - name: Publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: packages/atlas-ui
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then npm publish --tag next; else npm publish; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Published unscoped on npmjs as atlas3-ui; GitHub Packages only accepts the @ohdsi name.
      - name: Pack for npmjs
        if: startsWith(github.ref, 'refs/tags/atlas-ui-v')
        working-directory: packages/atlas-ui
        run: |
          npm pkg delete publishConfig
          npm pkg set name=atlas3-ui
          mkdir -p "$RUNNER_TEMP/npmjs"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npmjs"

      - name: Upload npmjs package
        if: startsWith(github.ref, 'refs/tags/atlas-ui-v')
        uses: actions/upload-artifact@v4
        with:
          name: npmjs-package
          path: ${{ runner.temp }}/npmjs/*.tgz
          retention-days: 7

  publish-npmjs:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/atlas-ui-v')
    runs-on: ubuntu-latest
    environment: npmjs
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: npmjs-package

      - name: Publish to npmjs
        run: npm publish ./*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
