name: Publish @ohdsi/atlas-ui

on:
  push:
    branches: [develop]
    tags: ['atlas-ui-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ohdsi'
          cache: 'npm'
      - run: npm ci
      - run: npm run lib:build
      - name: Stamp prerelease version on develop
        if: github.ref == 'refs/heads/develop'
        run: |
          cd packages/atlas-ui
          TS=$(date +%Y%m%d%H%M%S); SHA=$(git rev-parse --short HEAD)
          npm version --no-git-tag-version "$(node -p "require('./package.json').version")-$TS-$SHA"
      - name: Publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: packages/atlas-ui
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then npm publish --tag next; else npm publish; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Skipped until an NPM_TOKEN secret with publish rights to the @ohdsi scope exists.
      - name: Check for npmjs token
        id: npmjs
        run: echo "enabled=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish to npmjs
        if: startsWith(github.ref, 'refs/tags/atlas-ui-v') && steps.npmjs.outputs.enabled == 'true'
        working-directory: packages/atlas-ui
        run: |
          npm pkg delete publishConfig
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"
          npm publish --access public --@ohdsi:registry=https://registry.npmjs.org/
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
