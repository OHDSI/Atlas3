name: Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Generate test results summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: coverage/junit.xml


      - name: Extract coverage percentage
        id: coverage
        run: |
          LINES_PCT=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          STATEMENTS_PCT=$(jq '.total.statements.pct' coverage/coverage-summary.json)
          BRANCHES_PCT=$(jq '.total.branches.pct' coverage/coverage-summary.json)
          FUNCTIONS_PCT=$(jq '.total.functions.pct' coverage/coverage-summary.json)

          echo "lines=$LINES_PCT" >> $GITHUB_OUTPUT
          echo "statements=$STATEMENTS_PCT" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES_PCT" >> $GITHUB_OUTPUT
          echo "functions=$FUNCTIONS_PCT" >> $GITHUB_OUTPUT

      - name: Generate coverage summary
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lines | ${{ steps.coverage.outputs.lines }}% | 84% | $([[ $(echo "${{ steps.coverage.outputs.lines }} >= 84" | bc -l) -eq 1 ]] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "| Statements | ${{ steps.coverage.outputs.statements }}% | 84% | $([[ $(echo "${{ steps.coverage.outputs.statements }} >= 84" | bc -l) -eq 1 ]] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "| Branches | ${{ steps.coverage.outputs.branches }}% | 85% | $([[ $(echo "${{ steps.coverage.outputs.branches }} >= 85" | bc -l) -eq 1 ]] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions | ${{ steps.coverage.outputs.functions }}% | 69% | $([[ $(echo "${{ steps.coverage.outputs.functions }} >= 69" | bc -l) -eq 1 ]] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Download the **coverage-report** artifact for the detailed HTML report." >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            !coverage/**/*.tmp
