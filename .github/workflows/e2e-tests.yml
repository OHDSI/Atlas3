name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    # Browsers + OS deps are pre-baked in this image, so we avoid the
    # `playwright install` browser download from cdn.playwright.dev, which
    # hangs indefinitely on GitHub runners. Keep the version in sync with the
    # @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Required: playwright's webServer serves this build with `vite preview`.
      - name: Build application for E2E tests
        run: npm run build -- --mode test

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
