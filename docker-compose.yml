volumes:
  atlas3-postgres-data:
    name: atlas3-postgres-data
  atlas3-ssl-data:
    name: atlas3-ssl-data
  atlas3-webapi-data:
    name: atlas3-webapi-data


services:
  atlas3-init:
    image: alpine:latest
    container_name: atlas3-init
    volumes:
      - atlas3-ssl-data:/ssl
      - atlas3-webapi-data:/data

    command: >
      sh -c '
      if [ ! -f /ssl/cert.pem ] || [ ! -f /ssl/key.pem ]; then
        echo "Generating self-signed SSL certificates...";
        apk add --no-cache openssl;
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /ssl/key.pem -out /ssl/cert.pem -subj "/C=US/ST=State/L=City/O=Organization/CN=localhost" -addext "subjectAltName=DNS:localhost,DNS:*.localhost,IP:127.0.0.1";
        echo "✓ SSL certificates generated";
      else
        echo "✓ SSL certificates already exist";
      fi;
      echo "Setting up WebAPI data directory permissions...";
      mkdir -p /data/cache /data/trexsql-lib;
      chown -R 101:101 /data;
      chmod -R 755 /data;
      echo "✓ WebAPI data directory configured";
      '

  atlas3-postgres:
    image: ohdsi/broadsea-atlasdb:2.3.0
    container_name: atlas3-postgres
    hostname: broadsea-atlasdb
    platform: linux/amd64
    restart: unless-stopped
    cpus: 2
    mem_limit: "2G"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypass}
    ports:
      - "5433:5432"
    volumes:
      - atlas3-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  atlas3-webapi:
    image: ghcr.io/ohdsi/webapi:3.0-dev
    container_name: atlas3-webapi
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/WebAPI/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      DATASOURCE_URL: jdbc:postgresql://atlas3-postgres:5432/postgres?currentSchema=webapi
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: mypass
      DATASOURCE_OHDSI_SCHEMA: webapi
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: webapi
      SPRING_BATCH_REPOSITORY_TABLEPREFIX: webapi.batch_
      SPRING_FLYWAY_URL: jdbc:postgresql://atlas3-postgres:5432/postgres?currentSchema=webapi
      SPRING_FLYWAY_SCHEMAS: webapi
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: mypass
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "2.2.5.20180212152023"
      SPRING_FLYWAY_PLACEHOLDERS_OHDSISCHEMA: webapi
      SECURITY_PROVIDER: AtlasRegularSecurity
      SECURITY_TOKEN_EXPIRATION: "43200"
      SECURITY_CORS_ENABLED: "true"
      SECURITY_ORIGIN: "*"
      SECURITY_SSL_ENABLED: "false"
      SECURITY_DEFAULTGLOBALREADPERMISSIONS: "true"
      SECURITY_OAUTH_CALLBACK_UI: "http://localhost/atlas/#/welcome"
      SECURITY_OAUTH_CALLBACK_API: "http://localhost:8080/WebAPI/user/oauth/callback"
      SECURITY_OAUTH_CALLBACK_URLRESOLVER: "query"
      SECURITY_AUTH_JDBC_ENABLED: "true"
      SECURITY_AUTH_WINDOWS_ENABLED: "false"
      SECURITY_AUTH_KERBEROS_ENABLED: "false"
      SECURITY_AUTH_OPENID_ENABLED: "false"
      SECURITY_AUTH_FACEBOOK_ENABLED: "false"
      SECURITY_AUTH_GITHUB_ENABLED: "false"
      SECURITY_AUTH_GOOGLE_ENABLED: "false"
      SECURITY_AUTH_LDAP_ENABLED: "false"
      SECURITY_AUTH_AD_ENABLED: "false"
      SECURITY_AUTH_CAS_ENABLED: "false"
      SECURITY_DB_DATASOURCE_SCHEMA: webapi_security
      SECURITY_DB_DATASOURCE_URL: jdbc:postgresql://atlas3-postgres:5432/postgres?currentSchema=webapi_security
      SECURITY_DB_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SECURITY_DB_DATASOURCE_USERNAME: postgres
      SECURITY_DB_DATASOURCE_PASSWORD: mypass
      SECURITY_DB_DATASOURCE_AUTHENTICATIONQUERY: "SELECT password, email AS firstname, NULL AS middlename, email AS lastname FROM webapi_security.security WHERE email = ?"
      TREXSQL_ENABLED: "true"
      TREXSQL_CACHE_PATH: /data/cache
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration
      JAVA_OPTS: "-Dtrexsql.enabled=true -Dtrexsql.cache-path=/data/cache -Dtrexsql.sources.EUNOMIA.enabled=true -Dtrexsql.sources.EUNOMIA.database-code=EUNOMIA -Dtrexsql.sources.EUNOMIA.cdm-schema=demo_cdm -Dtrexsql.security.enabled=false -Dorg.duckdb.lib_path=/data/trexsql-lib/libtrexsql_java.so -Dspring.flyway.placeholders.ohdsiSchema=webapi"
      HOME: /data
    volumes:
      - atlas3-webapi-data:/data
    depends_on:
      atlas3-init:
        condition: service_completed_successfully
      atlas3-postgres:
        condition: service_healthy

  atlas3-db-init:
    image: postgres:16-alpine
    container_name: atlas3-db-init
    volumes:
      - ./atlasdb:/scripts:ro
    environment:
      PGHOST: atlas3-postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-mypass}
      PGDATABASE: postgres
    depends_on:
      atlas3-webapi:
        condition: service_healthy
    command: sh -c 'for f in /scripts/*.sql; do psql -f "$$f"; done'

  atlas3-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AUTH_ENABLED: "true"
        VITE_AUTH_SKIP_LOGIN: "false"
        VITE_AUTH_PROVIDERS: '[{"name":"Database","url":"user/login/db","ajax":true,"icon":"mdi-database","isUseCredentialsForm":true}]'
    image: atlas3-frontend:local
    container_name: atlas3-frontend
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - atlas3-ssl-data:/etc/nginx/ssl:ro
    environment:
      WEBAPI_URL: ${WEBAPI_URL:-https://localhost/WebAPI}
    depends_on:
      atlas3-init:
        condition: service_completed_successfully
      atlas3-db-init:
        condition: service_completed_successfully
